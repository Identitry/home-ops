---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-agent-data
  namespace: ai-automation
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-hermes-agent-env
  namespace: ai-automation
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: hermes-agent-env
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          reloader.stakater.com/auto: "true"
  data:
    - secretKey: HOME_ASSISTANT_TOKEN
      remoteRef:
        key: /HERMES/HOME_ASSISTANT_TOKEN
    - secretKey: HOME_ASSISTANT_URL
      remoteRef:
        key: /HERMES/HOME_ASSISTANT_URL
    - secretKey: HERMES_DASHBOARD_OIDC_CLIENT_ID
      remoteRef:
        key: /HERMES/DASHBOARD_OIDC_CLIENT_ID
    - secretKey: HERMES_DASHBOARD_OIDC_CLIENT_SECRET
      remoteRef:
        key: /HERMES/DASHBOARD_OIDC_CLIENT_SECRET
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes-agent
  namespace: ai-automation
  annotations:
    lineage.cozystack.io/ignore: "true"
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: cozy-fluxcd
  install:
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    disableWait: true
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      hermes-agent:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: nousresearch/hermes-agent
              tag: v2026.7.7.2@sha256:3db34ce19adfa080736a2a3feb0316dbcccc588faa9afe7fd8ae1c03b4f1a53a
              pullPolicy: IfNotPresent
            args:
              - gateway
              - run
            env:
              - name: TZ
                value: ${TZ}
              - name: HERMES_DASHBOARD
                value: "1"
              - name: HERMES_DASHBOARD_HOST
                value: 0.0.0.0
              - name: HERMES_DASHBOARD_PORT
                value: "9119"
              - name: HERMES_DASHBOARD_PUBLIC_URL
                value: "https://hermes.${DOMAIN}"
              - name: HERMES_DASHBOARD_OIDC_ISSUER
                value: "https://auth.${DOMAIN}/application/o/hermes/"
              - name: HERMES_DASHBOARD_OIDC_SCOPES
                value: "openid profile email"
            envFrom:
              - secretRef:
                  name: hermes-agent-env
            ports:
              - name: dashboard
                containerPort: 9119
            resources:
              requests:
                cpu: "2"
                memory: 1Gi
              limits:
                cpu: "2"
                memory: 1Gi
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false

    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: hermes-agent-data
        globalMounts:
          - path: /opt/data

    service:
      hermes-agent:
        controller: hermes-agent
        annotations:
          external-dns.alpha.kubernetes.io/internal: "true"
          external-dns.alpha.kubernetes.io/technitium: "true"
          external-dns.alpha.kubernetes.io/hostname: "hermes.${DOMAIN}"
          external-dns.alpha.kubernetes.io/target: "cluster-ingress.${DOMAIN}"
        ports:
          http:
            port: 9119
            targetPort: dashboard

    ingress:
      hermes-agent:
        enabled: true
        className: tenant-root
        annotations:
          lineage.cozystack.io/ignore: "true"
          external-dns.alpha.kubernetes.io/target: ${CLOUDFLARE_TUNNEL_TARGET}
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
          external-dns.alpha.kubernetes.io/hostname: "hermes.${DOMAIN}"
        hosts:
          - host: hermes.${DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: hermes-agent
                  port: 9119
        tls:
          - secretName: wildcard-le-tls-cert
            hosts:
              - hermes.${DOMAIN}
