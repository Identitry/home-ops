# Keeps the local vpa-for-vpa recommender from being driven back below 1Gi.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-for-vpa
  namespace: cozy-vpa-for-vpa
spec:
  resourcePolicy:
    containerPolicies:
      - containerName: recommender
        minAllowed:
          cpu: 250m
          memory: 1Gi
